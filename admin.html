<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Church Auction Admin</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="wrap">

<h1>⛪ Church Auction — Admin</h1>

<div id="setupArea"></div>
<div id="authArea"></div>

<div id="app" class="hidden">

  <div id="actionMsg" class="card" style="display:none"></div>

  <!-- CURRENT ITEM -->
  <div class="card">

    <h2>Current Item</h2>

    <div class="grid">

      <div>
        <label>Item name</label>
        <input id="itemName" placeholder="Enter item name">
      </div>

      <div>
        <label>Starting price (₹)</label>
        <input id="startPrice" type="number" min="0" step="1" placeholder="0">
      </div>

    </div>

    <button class="primary" onclick="startItem()">START NEW ITEM</button>

    <button onclick="waiting()">WAITING</button>

    <button class="danger" onclick="sold()">SOLD</button>

    <button onclick="nextItem()">NEXT ITEM</button>

    <button class="primary" onclick="startFromBeginning()">
      START FROM BEGINNING
    </button>

  </div>


  <!-- LIVE AUCTION -->
  <div class="card center">

    <div id="itemLabel" class="muted">
      Waiting for item
    </div>

    <div id="currentBid" class="big">
      ₹0
    </div>

    <div id="highest">
      No bidder
    </div>

    <span id="status" class="status">
      WAITING
    </span>

  </div>


  <!-- OFFLINE BID -->
  <div class="card">

    <h2>Offline Bid</h2>

    <p class="muted">
      Use this when someone at church calls out a bid.
    </p>

    <div class="grid">

      <input
        id="offlineName"
        placeholder="Bidder name"
      >

      <input
        id="offlineAmount"
        type="number"
        min="0"
        step="1"
        placeholder="Bid ₹"
      >

    </div>

    <button class="good" onclick="offlineBid()">
      ADD OFFLINE BID
    </button>

  </div>


  <!-- RECENT BIDS -->
  <div class="card">

    <h2>Recent Bids</h2>

    <button
      class="danger"
      onclick="clearRecentBidHistory()"
    >
      CLEAR RECENT BID HISTORY
    </button>

    <div id="history" class="history"></div>

  </div>

</div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =========================================================
   SUPABASE CONFIGURATION
   ========================================================= */

const SUPABASE_URL =
"https://dcgtufrwqvuuyrlouepu.supabase.co";

const SUPABASE_KEY =
"sb_publishable_MZGvLkvhFDRt5tAri_rz6g_WThNuujt";

const RECENT_BIDS_CLEARED_KEY =
"churchAuctionRecentBidsClearedAt";


/* =========================================================
   SUPABASE
   ========================================================= */

let sb = null;
let channel = null;


/* =========================================================
   MONEY FORMAT
   ========================================================= */

function money(value) {

  return "₹" +
    Number(value || 0).toLocaleString(
      "en-IN",
      {
        maximumFractionDigits: 2
      }
    );

}


/* =========================================================
   ESCAPE TEXT
   ========================================================= */

function esc(value) {

  return String(value ?? "").replace(
    /[&<>"']/g,
    function(m) {

      return {
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"

      }[m];

    }
  );

}


/* =========================================================
   ADMIN LOGIN
   ========================================================= */

function authBox() {

  return `

    <div class="setup card">

      <h2>Admin Login</h2>

      <p class="muted">
        Sign in with your Supabase admin account.
      </p>

      <input
        id="adminEmail"
        type="email"
        placeholder="Admin email"
      >

      <input
        id="adminPassword"
        type="password"
        placeholder="Password"
      >

      <button
        class="primary"
        onclick="adminLogin()"
      >
        LOGIN
      </button>

      <p
        id="loginMsg"
        class="small error"
      ></p>

    </div>

  `;

}


/* =========================================================
   LOGIN
   ========================================================= */

window.adminLogin = async function() {

  const email =
    document.getElementById("adminEmail")
      .value.trim();

  const password =
    document.getElementById("adminPassword")
      .value;

  const msg =
    document.getElementById("loginMsg");

  msg.textContent = "";

  if (!email || !password) {

    msg.textContent =
      "Enter email and password.";

    return;

  }

  const { error } =
    await sb.auth.signInWithPassword({

      email: email,
      password: password

    });

  if (error) {

    msg.textContent =
      error.message;

    return;

  }

  location.reload();

};


/* =========================================================
   LOGOUT
   ========================================================= */

window.adminLogout = async function() {

  await sb.auth.signOut();

  location.reload();

};


/* =========================================================
   GET AUCTION STATE
   ========================================================= */

async function getState() {

  const { data, error } =
    await sb
      .from("auction_state")
      .select("*")
      .eq("id", 1)
      .single();

  if (error) throw error;

  return data;

}


/* =========================================================
   SHOW MESSAGE
   ========================================================= */

function showMsg(message, success=false) {

  const el =
    document.getElementById("actionMsg");

  if (!el) return;

  el.style.display = "block";

  el.textContent = message;

  el.className =
    "card " +
    (success ? "success" : "error");

}


/* =========================================================
   DISPLAY CURRENT STATE
   ========================================================= */

function render(a) {

  document.getElementById("itemLabel")
    .textContent =
    `Item ${a.item_number}: ${a.item_name}`;

  document.getElementById("currentBid")
    .textContent =
    money(a.current_bid);

  document.getElementById("highest")
    .textContent =
    a.highest_bidder
      ? `${esc(a.highest_bidder)} (${a.highest_bid_source})`
      : "No bidder";

  document.getElementById("status")
    .textContent =
    String(a.status || "waiting")
      .toUpperCase();

}


/* =========================================================
   REFRESH
   ========================================================= */

async function refresh() {

  try {

    const a =
      await getState();

    render(a);

    await loadBids();

  } catch (e) {

    showMsg(
      "Read failed: " +
      (e.message || e)
    );

  }

}


/* =========================================================
   UPDATE AUCTION
   ========================================================= */

async function updateAuction(fields) {

  try {

    showMsg("Saving...");

    const { data, error } =
      await sb
        .from("auction_state")
        .update({

          ...fields,

          updated_at:
            new Date().toISOString()

        })
        .eq("id", 1)
        .select("*")
        .single();

    if (error) {

      showMsg(
        "Update failed: " +
        error.message
      );

      console.error(error);

      return false;

    }

    render(data);

    await loadBids();

    showMsg(
      "Saved successfully.",
      true
    );

    return true;

  } catch (e) {

    showMsg(
      "Update failed: " +
      (e.message || e)
    );

    return false;

  }

}


/* =========================================================
   START NEW ITEM
   ========================================================= */

window.startItem = async function() {

  const name =
    document.getElementById("itemName")
      .value.trim();

  const start =
    Number(
      document.getElementById("startPrice")
        .value
    );

  if (
    !name ||
    !Number.isFinite(start) ||
    start < 0
  ) {

    showMsg(
      "Enter item name and starting price."
    );

    return;

  }

  await updateAuction({

    item_name: name,

    starting_bid: start,

    current_bid: start,

    highest_bidder: null,

    highest_bid_source: null,

    status: "open"

  });

};


/* =========================================================
   WAITING
   ========================================================= */

window.waiting = async function() {

  await updateAuction({

    status: "waiting"

  });

};


/* =========================================================
   SOLD
   ========================================================= */

window.sold = async function() {

  const a =
    await getState();

  if (a.status !== "open") {

    alert("No open auction.");

    return;

  }

  await updateAuction({

    status: "sold"

  });

};


/* =========================================================
   NEXT ITEM
   ========================================================= */

window.nextItem = async function() {

  const a =
    await getState();

  await updateAuction({

    item_number:
      a.item_number + 1,

    item_name:
      "Waiting for next item",

    starting_bid: 0,

    current_bid: 0,

    highest_bidder: null,

    highest_bid_source: null,

    status: "waiting"

  });

};


/* =========================================================
   START FROM BEGINNING
   ========================================================= */

window.startFromBeginning = async function() {

  const confirmStart =
    confirm(
      "Start the auction again from Item 1?"
    );

  if (!confirmStart) return;

  await updateAuction({

    item_number: 1,

    item_name:
      "Waiting for next item",

    starting_bid: 0,

    current_bid: 0,

    highest_bidder: null,

    highest_bid_source: null,

    status: "waiting"

  });

};


/* =========================================================
   OFFLINE BID
   ========================================================= */

window.offlineBid = async function() {

  const a =
    await getState();

  const name =
    document.getElementById("offlineName")
      .value.trim();

  const amount =
    Number(
      document.getElementById("offlineAmount")
        .value
    );

  if (!name || !amount) {

    alert(
      "Enter bidder name and amount."
    );

    return;

  }

  const { data, error } =
    await sb.rpc(
      "place_bid",
      {

        p_item_number:
          a.item_number,

        p_bidder_name:
          name,

        p_amount:
          amount,

        p_source:
          "offline"

      }
    );

  if (error) {

    alert(error.message);

    return;

  }

  if (!data.ok) {

    alert(data.message);

    return;

  }

  document.getElementById(
    "offlineAmount"
  ).value = "";

  await refresh();

};


/* =========================================================
   LOAD RECENT BIDS
   ========================================================= */

async function loadBids() {

  if (!sb) return;

  const { data, error } =
    await sb
      .from("bids")
      .select("*")
      .order(
        "created_at",
        { ascending: false }
      )
      .limit(30);

  if (error) return;

  const clearedAt =
    Number(
      localStorage.getItem(
        RECENT_BIDS_CLEARED_KEY
      ) || 0
    );

  const visible =
    (data || []).filter(
      function(b) {

        if (!clearedAt)
          return true;

        const t =
          Date.parse(
            b.created_at || ""
          );

        return !Number.isNaN(t) &&
               t > clearedAt;

      }
    );

  document.getElementById(
    "history"
  ).innerHTML =
    visible.map(
      function(b) {

        return `
          <div>
            <b>${esc(b.bidder_name)}</b>
            —
            ${money(b.amount)}
            <span class="muted">
              (${esc(b.source)})
            </span>
          </div>
        `;

      }
    ).join("");

}


/* =========================================================
   CLEAR RECENT BID HISTORY
   ========================================================= */

window.clearRecentBidHistory =
async function() {

  if (
    !confirm(
      "Clear the Recent Bids list?"
    )
  ) return;

  const clearedAt =
    Date.now();

  localStorage.setItem(
    RECENT_BIDS_CLEARED_KEY,
    String(clearedAt)
  );

  document.getElementById(
    "history"
  ).innerHTML = "";

  showMsg(
    "Recent bids cleared.",
    true
  );

};


/* =========================================================
   INITIALIZE
   ========================================================= */

async function init() {

  try {

    sb =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

    const {
      data: { session },
      error
    } =
      await sb.auth.getSession();

    if (error) {

      document.getElementById(
        "authArea"
      ).innerHTML = `
        <div class="card error">
          ${esc(error.message)}
        </div>
      `;

      return;

    }

    if (!session) {

      document.getElementById(
        "authArea"
      ).innerHTML =
        authBox();

      return;

    }

    document.getElementById(
      "authArea"
    ).innerHTML = `
      <div class="card">
        <button onclick="adminLogout()">
          LOG OUT
        </button>
      </div>
    `;

    document.getElementById(
      "app"
    ).classList.remove("hidden");

    await refresh();

    channel =
      sb
        .channel("auction-live")
        .on(
          "postgres_changes",
          {
            event: "*",
            schema: "public",
            table: "auction_state"
          },
          refresh
        )
        .on(
          "postgres_changes",
          {
            event: "*",
            schema: "public",
            table: "bids"
          },
          loadBids
        )
        .subscribe();

  } catch (e) {

    document.getElementById(
      "authArea"
    ).innerHTML = `
      <div class="card error">
        ${esc(e.message || e)}
      </div>
    `;

  }

}


/* =========================================================
   AUTO REFRESH
   ========================================================= */

setInterval(
  function() {

    if (
      typeof refresh === "function"
    ) {

      refresh();

    }

  },
  1000
);


/* START */
init();

</script>

</body>
</html>
