<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Church Auction TV</title><link rel="stylesheet" href="style.css"></head><style>#tvPinGate{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:#111;color:#fff;font-family:Arial,sans-serif}#tvPinGate .box{width:min(92vw,380px);padding:28px;border-radius:16px;background:#222;text-align:center}#tvPinGate input{width:100%;box-sizing:border-box;padding:14px;margin:14px 0;border-radius:10px;border:1px solid #555;background:#111;color:#fff;font-size:24px;text-align:center;letter-spacing:8px}#tvPinGate button{width:100%;padding:14px;border:0;border-radius:10px;font-size:18px;font-weight:700}.tv-locked>*:not(#tvPinGate){visibility:hidden}</style><div id="tvPinGate"><div class="box"><h2>🔐 TV Display</h2><p>Enter the 4-digit TV PIN</p><input id="tvPinInput" type="password" inputmode="numeric" maxlength="4" autofocus><button id="tvPinBtn">Unlock TV</button><div id="tvPinErr"></div></div></div><script>document.body.classList.add('tv-locked');(()=>{const P='1206',g=document.getElementById('tvPinGate'),i=document.getElementById('tvPinInput'),b=document.getElementById('tvPinBtn'),e=document.getElementById('tvPinErr');function u(){if(i.value===P){sessionStorage.setItem('churchAuctionTvUnlocked','1');g.remove();document.body.classList.remove('tv-locked')}else{e.textContent='Incorrect PIN';i.value='';i.focus()}}b.onclick=u;i.onkeydown=x=>{if(x.key==='Enter')u()};if(sessionStorage.getItem('churchAuctionTvUnlocked')==='1'){g.remove();document.body.classList.remove('tv-locked')}})();</script>
<body class="tv-landscape">
<div class="tv-shell">
  <div class="tv-brand-bar church-brand"><span class="brand-cross">✝️</span> CSI MEEETPAR YESU ALAYAM</div>
  <div id="soldOverlay" class="sold-overlay"><div class="sold-box"><div class="sold-title">🔨 SOLD OUT TO</div><div id="soldEmail" class="sold-email"></div><div id="soldSub" class="sold-sub">Item sold successfully</div></div></div>
  <div class="tv-topbar">
    <div class="tv-title auction-pulse">⛪ CHURCH AUCTION</div>
    <div class="tv-controls">
      <button id="slideshowBtn" onclick="toggleSlideshow()">▶ SLIDESHOW</button>
      <select id="slideInterval" title="Slideshow interval">
        <option value="5000">5 sec</option>
        <option value="10000" selected>10 sec</option>
        <option value="15000">15 sec</option>
        <option value="30000">30 sec</option>
      </select>
      <button onclick="toggleFullscreen()">⛶ FULLSCREEN</button>
    </div>
  </div>
  <div id="setupArea"></div>
  <div id="app" class="hidden tv-stage">
    <section id="auctionSlide" class="tv-slide active">
      <div class="tv-auction-card">
        <div id="itemLabel" class="tv-item-label">Waiting...</div>
        <div id="currentBid" class="tv-bid">₹0</div>
        <div id="highest" class="tv-highest">No bidder</div>
        <span id="status" class="status">WAITING</span>
      </div>
      <div class="tv-live-panel">
        <div class="tv-live-head"><span>📹 LIVE PRODUCT CAMERA</span><span id="miniCameraStatus">● CONNECTING</span></div>
        <video id="miniCameraVideo" class="tv-mini-camera-video" autoplay playsinline muted></video>
        <div class="tv-live-resolution">FULL HD 1920×1080 • 30 FPS</div>
      </div>
    </section>
    <section id="cameraSlide" class="tv-slide">
      <div class="tv-camera-card">
        <div class="tv-camera-title live-glow">📹 LIVE PRODUCT • CSI MEEETPAR YESU ALAYAM</div>
        <video id="cameraVideo" class="tv-camera-video" autoplay playsinline></video>
        <div id="cameraStatus" class="cameraStatus muted">Waiting for church camera…</div>
      </div>
    </section>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const DEFAULT_CONFIG_KEY = "churchAuctionConfig";
const EMBEDDED_CONFIG = {url:"https://dcgtufrwqvuuyrlouepu.supabase.co",key:"sb_publishable_MZGvLkvhFDRt5tAri_rz6g_WThNuujt"};

function getConfig(){
 try{const saved=JSON.parse(localStorage.getItem(DEFAULT_CONFIG_KEY)||"{}");return saved.url&&saved.key?saved:EMBEDDED_CONFIG;}
 catch{return EMBEDDED_CONFIG;}
}
function saveConfig(c) { localStorage.setItem(DEFAULT_CONFIG_KEY, JSON.stringify(c)); }

function configBox() {
  const c = getConfig();
  if (c.url && c.key) return "";
  return `
    <div class="setup card">
      <h2>First-time setup</h2>
      <p>Enter your Supabase Project URL and Publishable key. This is saved only in this browser.</p>
      <input id="sbUrl" placeholder="https://your-project.supabase.co" />
      <input id="sbKey" placeholder="sb_publishable_..." />
      <button onclick="saveSupabaseConfig()">Save & continue</button>
    </div>`;
}
window.saveSupabaseConfig = () => {
  const url = document.getElementById("sbUrl").value.trim().replace(/\/$/,"");
  const key = document.getElementById("sbKey").value.trim();
  if (!url || !key) return alert("Enter both values.");
  saveConfig({url,key});
  location.reload();
};

function money(v) {
  return "₹" + Number(v || 0).toLocaleString("en-IN", {maximumFractionDigits: 2});
}
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
</script>
<script>
let sb,channel,camChannel,camPeer,viewerId=Math.random().toString(36).slice(2);
async function init(){
 const c=getConfig();document.getElementById("setupArea").innerHTML=configBox();if(!c.url||!c.key)return;
 sb=supabase.createClient(c.url,c.key);document.getElementById("app").classList.remove("hidden");await refresh();
 channel=sb.channel("auction-live").on("postgres_changes",{event:"*",schema:"public",table:"auction_state"},refresh).subscribe();
 setupCameraViewer();
}
async function refresh(){const {data,error}=await sb.from("auction_state").select("*").eq("id",1).single();if(error)return;
 document.getElementById("itemLabel").textContent=`Item ${data.item_number}: ${data.item_name}`;
 document.getElementById("currentBid").textContent=money(data.current_bid);
 document.getElementById("highest").textContent=data.highest_bidder?`${esc(String(data.highest_bidder).split("|||")[0])} (${data.highest_bid_source})`:"No bidder";
 document.getElementById("status").textContent=data.status.toUpperCase();
 const sold = ["sold","sold_out"].includes(String(data.status).toLowerCase());
 document.getElementById("soldOverlay").classList.toggle("show", sold);
 const parts=String(data.highest_bidder||"").split("|||");
 const winner=parts[0]||"Winner";
 const email=parts[1]||"";
 const address=parts[2]||"";
 const emailEl=document.getElementById("soldEmail");
 if(emailEl) emailEl.textContent=sold?`${email} (${winner}, ${address})`:"";
 document.getElementById("soldSub").textContent=sold?`SOLD OUT TO ${winner} • ${money(data.current_bid)}`:"";
}
const CAMERA_ICE_SERVERS=[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]; let cameraPendingIce=[]; let liveCameraSettings={zoom:1,rotation:0};
function applyLiveCameraSettings(settings){
  if(!settings)return;
  if(Number.isFinite(Number(settings.zoom))) liveCameraSettings.zoom=Math.max(1,Number(settings.zoom));
  if(Number.isFinite(Number(settings.rotation))) liveCameraSettings.rotation=((Number(settings.rotation)%360)+360)%360;
  const transform=`rotate(${liveCameraSettings.rotation}deg) scale(${liveCameraSettings.rotation===90||liveCameraSettings.rotation===270 ? 0.5625 : 1})`;
  ['cameraVideo','miniCameraVideo'].forEach(id=>{
    const v=document.getElementById(id);
    if(v){v.style.transformOrigin='center center';v.style.transform=transform;v.dataset.cameraRotation=String(liveCameraSettings.rotation);v.dataset.cameraZoom=String(liveCameraSettings.zoom);}
  });
}

async function setupCameraViewer(){
 camChannel=sb.channel("church-auction-camera-v1",{config:{broadcast:{ack:true}}});
 camChannel.on("broadcast",{event:"offer"},async ({payload})=>{
   if(payload.id!==viewerId)return;
   if(camPeer)camPeer.close();
   camPeer=new RTCPeerConnection({iceServers:CAMERA_ICE_SERVERS});
   cameraPendingIce=[];
   camPeer.onconnectionstatechange=()=>{if(camPeer.connectionState==='failed'){document.getElementById('cameraStatus').textContent='⚠️ LIVE CAMERA CONNECTION LOST — reconnecting...'; setTimeout(()=>setupCameraViewer(),1500);}};
   camPeer.ontrack=e=>{const stream=e.streams[0];document.getElementById('cameraVideo').srcObject=stream;const mini=document.getElementById('miniCameraVideo');if(mini)mini.srcObject=stream;document.getElementById('cameraStatus').textContent='🔴 LIVE PRODUCT CAMERA';const miniStatus=document.getElementById('miniCameraStatus');if(miniStatus)miniStatus.textContent='● LIVE';};
   camPeer.onicecandidate=e=>{if(e.candidate)camChannel.send({type:'broadcast',event:'ice',payload:{id:viewerId,candidate:e.candidate}})};
   applyLiveCameraSettings(liveCameraSettings);
   await camPeer.setRemoteDescription(payload.description); for(const c of cameraPendingIce){await camPeer.addIceCandidate(c).catch(()=>{});} cameraPendingIce=[]; const ans=await camPeer.createAnswer();await camPeer.setLocalDescription(ans);
   await camChannel.send({type:'broadcast',event:'answer',payload:{id:viewerId,description:camPeer.localDescription}});
 }).on('broadcast',{event:'camera-settings'},({payload})=>{if(!payload)return; if(payload.target&&payload.target!==viewerId)return; applyLiveCameraSettings(payload);}).on('broadcast',{event:'ice'},async ({payload})=>{if(payload.id!==viewerId||!payload.candidate)return; if(!camPeer)return; try{if(camPeer.remoteDescription)await camPeer.addIceCandidate(payload.candidate);else cameraPendingIce.push(payload.candidate);}catch(e){console.warn('ICE candidate ignored',e);}}).subscribe(async status=>{if(status==='SUBSCRIBED'){await camChannel.send({type:'broadcast',event:'join',payload:{id:viewerId}});}});
}
init();
</script>
<script>
/* Automatic live refresh: keeps this screen synchronized without manual browser refresh. */
setInterval(() => {
  try {
    if (typeof refresh === "function") refresh();
  } catch (e) {
    console.warn("Automatic refresh failed:", e);
  }
}, 1000);
</script>

<script>
let slideshowRunning=false, slideshowTimer=null, slideshowIndex=0;
function showSlide(index){
  const slides=[document.getElementById('auctionSlide'),document.getElementById('cameraSlide')];
  slides.forEach((s,i)=>s.classList.toggle('active',i===index));
  slideshowIndex=index;
}
function toggleSlideshow(){
  slideshowRunning=!slideshowRunning;
  const btn=document.getElementById('slideshowBtn');
  if(slideshowRunning){
    btn.textContent='⏸ SLIDESHOW';
    const ms=Number(document.getElementById('slideInterval').value)||10000;
    showSlide(0);
    slideshowTimer=setInterval(()=>showSlide(slideshowIndex===0?1:0),ms);
  }else{
    btn.textContent='▶ SLIDESHOW';
    clearInterval(slideshowTimer); slideshowTimer=null;
    showSlide(0);
  }
}
document.getElementById('slideInterval').addEventListener('change',()=>{
  if(slideshowRunning){clearInterval(slideshowTimer);const ms=Number(document.getElementById('slideInterval').value)||10000;slideshowTimer=setInterval(()=>showSlide(slideshowIndex===0?1:0),ms);}
});
async function toggleFullscreen(){
  try{
    if(!document.fullscreenElement) await document.documentElement.requestFullscreen();
    else await document.exitFullscreen();
  }catch(e){console.warn(e);}
}
</script>
</body></html>
