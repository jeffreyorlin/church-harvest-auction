<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Church Auction Camera</title><link rel="stylesheet" href="style.css"></head>
<body><style>
#cameraPassGate{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:#0b1220;color:#fff}
#cameraPassGate .pass-box{width:min(92vw,400px);padding:28px;border-radius:18px;background:#151f33;text-align:center;box-shadow:0 10px 40px #0008}
#cameraPassGate input{width:100%;box-sizing:border-box;padding:15px;margin:14px 0;border-radius:10px;border:0;font-size:24px;text-align:center;letter-spacing:7px;background:#eef2f7;color:#111}
#cameraPassGate button{width:100%;padding:14px;border:0;border-radius:10px;font-size:18px;font-weight:700;background:#ffd54a;color:#111}
#cameraPassGate .err{color:#ff8c8c;min-height:22px;margin-top:10px}
body.camera-locked>*:not(#cameraPassGate){visibility:hidden}
</style>
<div id="cameraPassGate">
  <div class="pass-box">
    <h2>🔐 Camera Access</h2>
    <p class="muted">Enter the camera passkey to continue.</p>
    <input id="cameraPassInput" type="password" inputmode="numeric" maxlength="6" autocomplete="off" autofocus>
    <button id="cameraPassBtn">UNLOCK CAMERA</button>
    <div id="cameraPassErr" class="err"></div>
  </div>
</div>
<script>
document.body.classList.add('camera-locked');
(function(){
  const PASSKEY='2580';
  const gate=document.getElementById('cameraPassGate'), input=document.getElementById('cameraPassInput');
  const btn=document.getElementById('cameraPassBtn'), err=document.getElementById('cameraPassErr');
  function unlock(){
    if(input.value===PASSKEY){
      sessionStorage.setItem('churchAuctionCameraUnlocked','1');
      gate.remove(); document.body.classList.remove('camera-locked');
    }else{
      err.textContent='Incorrect passkey.'; input.value=''; input.focus();
    }
  }
  btn.onclick=unlock;
  input.onkeydown=e=>{if(e.key==='Enter')unlock()};
  if(sessionStorage.getItem('churchAuctionCameraUnlocked')==='1'){
    gate.remove(); document.body.classList.remove('camera-locked');
  }
})();
</script>

<div class="wrap">
<h1>📱 Church Auction Camera</h1>
<div id="setupArea"></div><div id="authArea"></div>
<div id="app" class="hidden">
  <div class="card center camera-control-card">
    <h2>Live Product Camera</h2>
    <div class="camera-mode-row"><button id="rotateBtn" class="primary" onclick="rotateCamera()">↻ ROTATE 90°</button><span id="rotationValue" class="camera-rotation-value">0°</span></div>
    <video id="preview" class="camera-preview-landscape" autoplay muted playsinline></video>
    <div class="camera-tools">
      <label for="zoomRange">🔎 CAMERA ZOOM <span id="zoomValue">1.0×</span></label>
      <input id="zoomRange" type="range" min="1" max="4" step="0.1" value="1" oninput="setCameraZoom(this.value)">
    </div>
    <div><button class="primary" id="startBtn" onclick="startCamera()">START CAMERA</button><button id="stopBtn" onclick="stopCamera()" class="hidden">STOP CAMERA</button></div>
    <p id="camMsg" class="small muted">Point this phone at the product. Rotate the camera view and adjust lens zoom if supported.</p>
  </div>
  <div id="cameraSoldOverlay" class="camera-sold-overlay"><div class="camera-sold-box"><div class="camera-sold-title">🔨 SOLD OUT</div><div id="cameraSoldSub">SOLD SUCCESSFULLY</div></div></div>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const KEY='churchAuctionConfig', ROOM='church-auction-camera-v1'; let sb, channel, auctionChannel, stream=null, peers=new Map(); let cameraUser=null; let lastAuctionStatus=null; let cameraRotation=0; let cameraZoom=1; let hardwareZoom=false;
function cfg(){try{const saved=JSON.parse(localStorage.getItem(KEY)||"{}");return saved.url&&saved.key?saved:{url:"https://dcgtufrwqvuuyrlouepu.supabase.co",key:"sb_publishable_MZGvLkvhFDRt5tAri_rz6g_WThNuujt"};}catch{return {url:"https://dcgtufrwqvuuyrlouepu.supabase.co",key:"sb_publishable_MZGvLkvhFDRt5tAri_rz6g_WThNuujt"};}}
function save(c){localStorage.setItem(KEY,JSON.stringify(c))}
function box(){const c=cfg();if(c.url&&c.key)return '';return `<div class="setup card"><h2>First-time setup</h2><input id="sbUrl" placeholder="https://your-project.supabase.co"><input id="sbKey" placeholder="sb_publishable_..."><button onclick="saveCfg()">Save & continue</button></div>`}
window.saveCfg=()=>{const url=document.getElementById('sbUrl').value.trim().replace(/\/$/,'');const key=document.getElementById('sbKey').value.trim();if(!url||!key)return alert('Enter both values.');save({url,key});location.reload()}
function authBox(){return `<div class="setup card"><h2>Camera admin login</h2><p class="muted">Sign in with the same Supabase admin account used for the auction.</p><input id="email" type="email" placeholder="Admin email"><input id="pass" type="password" placeholder="Password"><button class="primary" onclick="login()">LOGIN</button><p id="loginMsg" class="small error"></p></div>`}
window.login=async()=>{const msg=document.getElementById('loginMsg');const {error}=await sb.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('pass').value});if(error)msg.textContent=error.message;else location.reload()}
async function init(){document.getElementById('setupArea').innerHTML=box();const c=cfg();if(!c.url||!c.key)return;sb=supabase.createClient(c.url,c.key);const {data:{session}}=await sb.auth.getSession();if(!session){document.getElementById('authArea').innerHTML=authBox();return;}cameraUser=session.user;document.getElementById('authArea').innerHTML='<div class="card"><button onclick="logout()">LOG OUT</button></div>';document.getElementById('app').classList.remove('hidden');channel=sb.channel(ROOM,{config:{broadcast:{ack:true}}});channel.on('broadcast',{event:'join'},async ({payload})=>{if(!stream)return;await makeOffer(payload.id)}).on('broadcast',{event:'answer'},async ({payload})=>{const pc=peers.get(payload.id);if(pc)await pc.setRemoteDescription(payload.description)}).on('broadcast',{event:'ice'},async ({payload})=>{const pc=peers.get(payload.id);if(pc&&payload.candidate)try{await pc.addIceCandidate(payload.candidate)}catch(e){}}).subscribe();
  auctionChannel=sb.channel('auction-camera-status').on('postgres_changes',{event:'UPDATE',schema:'public',table:'auction_state',filter:'id=eq.1'},({new:row})=>handleAuctionStatus(row)).subscribe();
  try{const {data}=await sb.from('auction_state').select('status,current_bid,highest_bidder,item_name').eq('id',1).single(); if(data) lastAuctionStatus=String(data.status||'').toLowerCase();}catch(e){}
}
window.logout=async()=>{stopCamera();await sb.auth.signOut();location.reload()}
function broadcastCameraTransform(){
  try{ if(channel) channel.send({type:'broadcast',event:'camera-transform',payload:{rotation:cameraRotation,zoom:cameraZoom,hardwareZoom}}); }catch(e){}
}
function applyCameraRotation(){
 const preview=document.getElementById('preview');
 preview.style.setProperty('--camera-rotation',cameraRotation+'deg');
 const el=document.getElementById('rotationValue'); if(el) el.textContent=cameraRotation+'°';
 broadcastCameraTransform();
}
function rotateCamera(){ cameraRotation=(cameraRotation+90)%360; applyCameraRotation(); }
async function setCameraZoom(value){
 cameraZoom=Number(value)||1;
 document.getElementById('zoomValue').textContent=cameraZoom.toFixed(1)+'×';
 const preview=document.getElementById('preview'); preview.style.setProperty('--camera-zoom',cameraZoom);
 const t=stream?.getVideoTracks?.()[0]; hardwareZoom=false;
 if(t?.applyConstraints){try{const caps=t.getCapabilities?.()||{}; if(caps.zoom){const z=Math.min(caps.zoom.max,Math.max(caps.zoom.min,cameraZoom)); await t.applyConstraints({advanced:[{zoom:z}]}); hardwareZoom=true;}}catch(e){}}
 broadcastCameraTransform();
}
function playClapping(){
 try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const ctx=new C();const now=ctx.currentTime;
   for(let i=0;i<12;i++){const t=now+i*0.11;const o=ctx.createOscillator(),g=ctx.createGain();o.type='triangle';o.frequency.setValueAtTime(1200+(i%3)*180,t);o.frequency.exponentialRampToValueAtTime(500,t+0.055);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.18,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+0.07);o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+0.075);} setTimeout(()=>ctx.close().catch(()=>{}),1800);
 }catch(e){console.warn('Clap sound blocked',e);}
}
function handleAuctionStatus(row){
 const status=String(row?.status||'').toLowerCase();
 const wasSold=['sold','sold_out'].includes(String(lastAuctionStatus||''));
 const isSold=['sold','sold_out'].includes(status);
 if(isSold && !wasSold){
   const overlay=document.getElementById('cameraSoldOverlay'); overlay.classList.add('show');
   setTimeout(playClapping,650);
   setTimeout(()=>overlay.classList.remove('show'),4500);
 }
 lastAuctionStatus=status;
}
async function startCamera(){
  const msg=document.getElementById('camMsg');
  const preview=document.getElementById('preview');
  const startBtn=document.getElementById('startBtn');
  const stopBtn=document.getElementById('stopBtn');
  try{
    if(!window.isSecureContext){
      msg.textContent='Camera error: Open this website using HTTPS (or http://localhost). Do not open camera.html directly as a file.';
      return;
    }
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      msg.textContent='Camera error: Your browser does not provide camera access. Use the latest Chrome/Edge and allow camera permission.';
      return;
    }

    // IMPORTANT: start with the simplest possible request. Some phones/webcams
    // reject 4K constraints even though they support camera access.
    msg.textContent='Requesting camera permission...';
    try{
      stream=await navigator.mediaDevices.getUserMedia({video:true,audio:false});
    }catch(e){
      console.error('Basic getUserMedia failed:',e);
      if(e.name==='NotAllowedError' || e.name==='PermissionDeniedError'){
        msg.textContent='Camera permission denied. In Chrome, click the camera/lock icon near the address bar → Camera → Allow, then reload this page.';
      }else if(e.name==='NotFoundError' || e.name==='DevicesNotFoundError'){
        msg.textContent='No camera found. Check that the phone/webcam camera is available and not disabled.';
      }else if(e.name==='NotReadableError' || e.name==='TrackStartError'){
        msg.textContent='Camera is busy. Close WhatsApp/Meet/Zoom/Camera and other apps using the camera, then try again.';
      }else if(e.name==='SecurityError'){
        msg.textContent='Camera blocked by browser security. Open the site with HTTPS.';
      }else{
        msg.textContent='Camera error: '+(e.message||e.name||String(e));
      }
      return;
    }

    const track=stream.getVideoTracks()[0];
    preview.srcObject=stream;
    applyCameraRotation();
    await setCameraZoom(document.getElementById('zoomRange').value);
    try{ await preview.play(); }catch(_){ }

    // After the camera is already working, request the highest supported quality.
    // Failure here must NOT stop the camera.
    try{
      if(track && track.applyConstraints){
        await track.applyConstraints({width:{ideal:3840},height:{ideal:2160},frameRate:{ideal:30}});
      }
    }catch(e){ console.warn('High-resolution request ignored:',e); }

    const settings=track && track.getSettings ? track.getSettings() : {};
    msg.textContent='LIVE — '+(settings.width||'?')+'×'+(settings.height||'?')+' — Camera connected successfully.';
    startBtn.classList.add('hidden');
    stopBtn.classList.remove('hidden');
  }catch(e){
    console.error('Camera error:',e);
    if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
    msg.textContent='Camera error: '+(e.message||e.name||String(e));
  }
}
async function makeOffer(id){if(peers.has(id))peers.get(id).close();const pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]});peers.set(id,pc);stream.getTracks().forEach(t=>{const sender=pc.addTrack(t,stream); if(sender&&sender.getParameters){const params=sender.getParameters(); params.encodings=params.encodings||[{}]; params.encodings[0].maxBitrate=18000000; params.encodings[0].maxFramerate=30; sender.setParameters(params).catch(()=>{});}});pc.onicecandidate=e=>{if(e.candidate)channel.send({type:'broadcast',event:'ice',payload:{id,candidate:e.candidate}})};const offer=await pc.createOffer();await pc.setLocalDescription(offer);await channel.send({type:'broadcast',event:'offer',payload:{id,description:pc.localDescription}})}
window.stopCamera=()=>{if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;for(const pc of peers.values())pc.close();peers.clear();document.getElementById('preview').srcObject=null;document.getElementById('startBtn').classList.remove('hidden');document.getElementById('stopBtn').classList.add('hidden');document.getElementById('camMsg').textContent='Camera stopped.'}
init();
</script></body></html>
