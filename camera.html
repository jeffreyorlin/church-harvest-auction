<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Church Auction Camera</title><link rel="stylesheet" href="style.css"></head>
<body>
<div class="church-brand tv-brand-bar"><span class="brand-cross">✝️</span> CSI MEEETPAR YESU ALAYAM</div><style>
#cameraPassGate{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:#0b1220;color:#fff}
#cameraPassGate .pass-box{width:min(92vw,400px);padding:28px;border-radius:18px;background:#151f33;text-align:center;box-shadow:0 10px 40px #0008}
#cameraPassGate input{width:100%;box-sizing:border-box;padding:15px;margin:14px 0;border-radius:10px;border:0;font-size:24px;text-align:center;letter-spacing:7px;background:#eef2f7;color:#111}
#cameraPassGate button{width:100%;padding:14px;border:0;border-radius:10px;font-size:18px;font-weight:700;background:#ffd54a;color:#111}
#cameraPassGate .err{color:#ff8c8c;min-height:22px;margin-top:10px}
body.camera-locked>*:not(#cameraPassGate){visibility:hidden}
</style>
<div id="cameraPassGate">
  <div class="pass-box">
    <h2>🔐 Camera Access</h2>
    <p class="muted">Enter the camera passkey to continue.</p>
    <input id="cameraPassInput" type="password" inputmode="numeric" maxlength="6" autocomplete="off" autofocus>
    <button id="cameraPassBtn">UNLOCK CAMERA</button>
    <div id="cameraPassErr" class="err"></div>
  </div>
</div>
<script>
document.body.classList.add('camera-locked');
(function(){
  const PASSKEY='2580';
  const gate=document.getElementById('cameraPassGate'), input=document.getElementById('cameraPassInput');
  const btn=document.getElementById('cameraPassBtn'), err=document.getElementById('cameraPassErr');
  function unlock(){
    if(input.value===PASSKEY){
      sessionStorage.setItem('churchAuctionCameraUnlocked','1');
      gate.remove(); document.body.classList.remove('camera-locked');
    }else{
      err.textContent='Incorrect passkey.'; input.value=''; input.focus();
    }
  }
  btn.onclick=unlock;
  input.onkeydown=e=>{if(e.key==='Enter')unlock()};
  if(sessionStorage.getItem('churchAuctionCameraUnlocked')==='1'){
    gate.remove(); document.body.classList.remove('camera-locked');
  }
})();
</script>

<div class="wrap">
<h1>📱 Church Auction Camera</h1>
<div id="setupArea"></div><div id="authArea"></div>
<div id="app" class="hidden">
  <div class="card center">
    <h2>Live Product Camera</h2>
    <video id="preview" autoplay muted playsinline></video>
    <div><button class="primary" id="startBtn" onclick="startCamera()">START CAMERA</button><button id="stopBtn" onclick="stopCamera()" class="hidden">STOP CAMERA</button></div>
    <p id="camMsg" class="small muted">Point this phone at the product. Keep this page open during the auction.</p>
  </div>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const KEY='churchAuctionConfig', ROOM='church-auction-camera-v1'; let sb, channel, stream=null, peers=new Map(); let cameraUser=null;
const ICE_SERVERS=[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}];
const pendingIce=new Map();
function cfg(){try{const saved=JSON.parse(localStorage.getItem(KEY)||"{}");return saved.url&&saved.key?saved:{url:"https://dcgtufrwqvuuyrlouepu.supabase.co",key:"sb_publishable_MZGvLkvhFDRt5tAri_rz6g_WThNuujt"};}catch{return {url:"https://dcgtufrwqvuuyrlouepu.supabase.co",key:"sb_publishable_MZGvLkvhFDRt5tAri_rz6g_WThNuujt"};}}
function save(c){localStorage.setItem(KEY,JSON.stringify(c))}
function box(){const c=cfg();if(c.url&&c.key)return '';return `<div class="setup card"><h2>First-time setup</h2><input id="sbUrl" placeholder="https://your-project.supabase.co"><input id="sbKey" placeholder="sb_publishable_..."><button onclick="saveCfg()">Save & continue</button></div>`}
window.saveCfg=()=>{const url=document.getElementById('sbUrl').value.trim().replace(/\/$/,'');const key=document.getElementById('sbKey').value.trim();if(!url||!key)return alert('Enter both values.');save({url,key});location.reload()}
function authBox(){return `<div class="setup card"><h2>Camera admin login</h2><p class="muted">Sign in with the same Supabase admin account used for the auction.</p><input id="email" type="email" placeholder="Admin email"><input id="pass" type="password" placeholder="Password"><button class="primary" onclick="login()">LOGIN</button><p id="loginMsg" class="small error"></p></div>`}
window.login=async()=>{const msg=document.getElementById('loginMsg');const {error}=await sb.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('pass').value});if(error)msg.textContent=error.message;else location.reload()}
async function init(){document.getElementById('setupArea').innerHTML=box();const c=cfg();if(!c.url||!c.key)return;sb=supabase.createClient(c.url,c.key);const {data:{session}}=await sb.auth.getSession();if(!session){document.getElementById('authArea').innerHTML=authBox();return;}cameraUser=session.user;document.getElementById('authArea').innerHTML='<div class="card"><button onclick="logout()">LOG OUT</button></div>';document.getElementById('app').classList.remove('hidden');channel=sb.channel(ROOM,{config:{broadcast:{ack:true}}});channel.on('broadcast',{event:'join'},async ({payload})=>{if(!stream)return;await makeOffer(payload.id)}).on('broadcast',{event:'answer'},async ({payload})=>{const pc=peers.get(payload.id);if(pc){try{await pc.setRemoteDescription(payload.description);const q=pendingIce.get(payload.id)||[];for(const c of q)await pc.addIceCandidate(c).catch(()=>{});pendingIce.delete(payload.id);}catch(e){console.warn('Remote description failed',e)}}}).on('broadcast',{event:'ice'},async ({payload})=>{const pc=peers.get(payload.id); if(!payload.candidate)return; if(!pc){return;} try{if(pc.remoteDescription)await pc.addIceCandidate(payload.candidate); else{const q=pendingIce.get(payload.id)||[];q.push(payload.candidate);pendingIce.set(payload.id,q);}}catch(e){console.warn('ICE candidate ignored',e);}}).subscribe()}
window.logout=async()=>{stopCamera();await sb.auth.signOut();location.reload()}
async function startCamera(){
  const msg=document.getElementById('camMsg');
  const preview=document.getElementById('preview');
  const startBtn=document.getElementById('startBtn');
  const stopBtn=document.getElementById('stopBtn');
  try{
    if(!window.isSecureContext){
      msg.textContent='Camera error: Open this website using HTTPS (or http://localhost). Do not open camera.html directly as a file.';
      return;
    }
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      msg.textContent='Camera error: Your browser does not provide camera access. Use the latest Chrome/Edge and allow camera permission.';
      return;
    }

    // Request Full HD 1920×1080 at 30 FPS first. If the device cannot provide
    // that exact mode, fall back to the best supported HD mode without stopping.
    msg.textContent='Requesting Full HD 1920×1080 camera at 30 FPS...';
    try{
      try{
        stream=await navigator.mediaDevices.getUserMedia({video:{width:{exact:1920},height:{exact:1080},frameRate:{exact:30}},audio:false});
      }catch(exactErr){
        console.warn('Exact 1920×1080@30 unavailable; using best supported mode:', exactErr);
        stream=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:1920,min:1280},height:{ideal:1080,min:720},frameRate:{ideal:30,min:24}},audio:false});
      }
    }catch(e){
      console.error('Basic getUserMedia failed:',e);
      if(e.name==='NotAllowedError' || e.name==='PermissionDeniedError'){
        msg.textContent='Camera permission denied. In Chrome, click the camera/lock icon near the address bar → Camera → Allow, then reload this page.';
      }else if(e.name==='NotFoundError' || e.name==='DevicesNotFoundError'){
        msg.textContent='No camera found. Check that the phone/webcam camera is available and not disabled.';
      }else if(e.name==='NotReadableError' || e.name==='TrackStartError'){
        msg.textContent='Camera is busy. Close WhatsApp/Meet/Zoom/Camera and other apps using the camera, then try again.';
      }else if(e.name==='SecurityError'){
        msg.textContent='Camera blocked by browser security. Open the site with HTTPS.';
      }else{
        msg.textContent='Camera error: '+(e.message||e.name||String(e));
      }
      return;
    }

    const track=stream.getVideoTracks()[0];
    preview.srcObject=stream;
    try{ await preview.play(); }catch(_){ }

    // Re-apply Full HD + 30 FPS when supported. Exact constraints are used so
    // the browser does not silently settle at 1280×720 when 1080p is available.
    try{
      if(track && track.applyConstraints){
        try{
          await track.applyConstraints({width:{exact:1920},height:{exact:1080},frameRate:{exact:30}});
        }catch(exactErr){
          console.warn('Exact 1920×1080@30 applyConstraints unavailable:', exactErr);
          await track.applyConstraints({width:{ideal:1920,min:1280},height:{ideal:1080,min:720},frameRate:{ideal:30,min:24}}).catch(()=>{});
        }
      }
    }catch(e){ console.warn('Camera constraints ignored:',e); }

    const settings=track && track.getSettings ? track.getSettings() : {};
    const actualFps=settings.frameRate ? Math.round(settings.frameRate) : '?';
    const isFullHD=settings.width===1920 && settings.height===1080;
    msg.textContent='LIVE — '+(settings.width||'?')+'×'+(settings.height||'?')+' @ '+actualFps+' FPS'+(isFullHD?' — FULL HD':' — device/browser mode')+' — Camera connected successfully.';
    startBtn.classList.add('hidden');
    stopBtn.classList.remove('hidden');
  }catch(e){
    console.error('Camera error:',e);
    if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
    msg.textContent='Camera error: '+(e.message||e.name||String(e));
  }
}
async function makeOffer(id){
  if(!stream)return;
  if(peers.has(id))peers.get(id).close();
  const pc=new RTCPeerConnection({iceServers:ICE_SERVERS});
  peers.set(id,pc); pendingIce.set(id,[]);
  stream.getTracks().forEach(t=>{const sender=pc.addTrack(t,stream); if(sender&&sender.getParameters){const params=sender.getParameters(); params.encodings=params.encodings||[{}]; params.encodings[0].maxBitrate=6000000; params.encodings[0].maxFramerate=30; sender.setParameters(params).catch(()=>{});}});
  pc.onicecandidate=e=>{if(e.candidate)channel.send({type:'broadcast',event:'ice',payload:{id,candidate:e.candidate}})};
  pc.onconnectionstatechange=()=>{ if(pc.connectionState==='failed'||pc.connectionState==='closed'){ peers.delete(id); pendingIce.delete(id); } };
  const offer=await pc.createOffer(); await pc.setLocalDescription(offer);
  await channel.send({type:'broadcast',event:'offer',payload:{id,description:pc.localDescription}});
}

window.stopCamera=()=>{if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;for(const pc of peers.values())pc.close();peers.clear();document.getElementById('preview').srcObject=null;document.getElementById('startBtn').classList.remove('hidden');document.getElementById('stopBtn').classList.add('hidden');document.getElementById('camMsg').textContent='Camera stopped.'}
init();
</script></body></html>
