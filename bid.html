<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Church Auction Bidding</title><link rel="stylesheet" href="style.css"></head>
<body>
<div class="wrap">
<div id="soldOverlay" class="sold-overlay"><div class="sold-box"><div class="sold-title">🎉 SOLD OUT!</div><div id="soldSub" class="sold-sub">Item sold successfully</div></div></div>
<h1>⛪ Live Church Auction</h1>
<div id="setupArea"></div>
<div id="app" class="hidden">
  <div class="card center">
    <div id="itemLabel" class="muted">Waiting...</div>
    <div id="currentBid" class="big">₹0</div>
    <div id="highest">No bidder</div>
    <span id="status" class="status">WAITING</span>
  </div>

  <div class="card">
    <h2>📹 LIVE PRODUCT</h2>
    <video id="cameraVideo" class="cameraLive" autoplay playsinline controls></video>
    <div id="cameraStatus" class="cameraStatus muted">Waiting for church camera…</div>
  </div>

  <div id="profileCard" class="card">
    <h2>👤 Bidder Details</h2>
    <p class="muted">Enter your name and address to participate in the auction.</p>
    <input id="profileName" type="text" placeholder="Enter your full name">
    <textarea id="profileAddress" rows="3" placeholder="Enter your address"></textarea>
    <button class="primary" onclick="saveProfile()">CONTINUE TO BIDDING</button>
    <p id="profileMsg" class="small"></p>
  </div>

  <div id="bidCard" class="card hidden">
    <h2>Place your online bid</h2>
    <p class="small">Bidding as <strong id="userName"></strong></p>
    <input id="amount" type="number" min="0" step="1" placeholder="Enter higher bid ₹">
    <button class="primary" onclick="bid()">PLACE BID</button>
    <button onclick="changeBidder()">CHANGE NAME / ADDRESS</button>
    <p id="msg" class="small"></p>
  </div>
</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const DEFAULT_CONFIG_KEY = "churchAuctionConfig";
function getConfig(){try{const saved=JSON.parse(localStorage.getItem(DEFAULT_CONFIG_KEY)||"{}");return saved.url&&saved.key?saved:{url:"https://dcgtufrwqvuuyrlouepu.supabase.co",key:"sb_publishable_MZGvLkvhFDRt5tAri_rz6g_WThNuujt"};}catch{return {url:"https://dcgtufrwqvuuyrlouepu.supabase.co",key:"sb_publishable_MZGvLkvhFDRt5tAri_rz6g_WThNuujt"};}}
function saveConfig(c){localStorage.setItem(DEFAULT_CONFIG_KEY,JSON.stringify(c))}
function configBox(){const c=getConfig();if(c.url&&c.key)return "";return `<div class="setup card"><h2>First-time setup</h2><p>Enter your Supabase Project URL and Publishable key. This is saved only in this browser.</p><input id="sbUrl" placeholder="https://your-project.supabase.co"><input id="sbKey" placeholder="sb_publishable_..."><button onclick="saveSupabaseConfig()">Save & continue</button></div>`}
window.saveSupabaseConfig=()=>{const url=document.getElementById("sbUrl").value.trim().replace(/\/$/,"");const key=document.getElementById("sbKey").value.trim();if(!url||!key)return alert("Enter both values.");saveConfig({url,key});location.reload()};
function money(v){return "₹"+Number(v||0).toLocaleString("en-IN",{maximumFractionDigits:2})}
</script>
<script>
let sb,channel,state,camChannel,camPeer,viewerId=Math.random().toString(36).slice(2);
let bidderName="", bidderAddress="";

async function init(){
 const c=getConfig();
 if(!c.url||!c.key)return;
 sb=supabase.createClient(c.url,c.key);
 document.getElementById("app").classList.remove("hidden");
 loadProfile();
 await refresh();
 setupCameraViewer();
 channel=sb.channel("auction-live").on("postgres_changes",{event:"UPDATE",schema:"public",table:"auction_state",filter:"id=eq.1"},refresh).subscribe();
 setInterval(refresh,1000);
}

function loadProfile(){
 bidderName=localStorage.getItem("churchAuctionBidderName")||"";
 bidderAddress=localStorage.getItem("churchAuctionBidderAddress")||"";
 document.getElementById("profileName").value=bidderName;
 document.getElementById("profileAddress").value=bidderAddress;
 if(bidderName.trim() && bidderAddress.trim()){
   document.getElementById("profileCard").classList.add("hidden");
   document.getElementById("bidCard").classList.remove("hidden");
   document.getElementById("userName").textContent=bidderName;
 }else{
   document.getElementById("profileCard").classList.remove("hidden");
   document.getElementById("bidCard").classList.add("hidden");
 }
}

window.saveProfile=()=>{
 const name=document.getElementById("profileName").value.trim();
 const address=document.getElementById("profileAddress").value.trim();
 const msg=document.getElementById("profileMsg");
 if(name.length<2){msg.textContent="❌ Please enter your full name.";return;}
 if(address.length<5){msg.textContent="❌ Please enter your address.";return;}
 localStorage.setItem("churchAuctionBidderName",name);
 localStorage.setItem("churchAuctionBidderAddress",address);
 bidderName=name; bidderAddress=address;
 msg.textContent="✅ Details saved.";
 loadProfile();
};

window.changeBidder=()=>{localStorage.removeItem("churchAuctionBidderName");localStorage.removeItem("churchAuctionBidderAddress");loadProfile();};

async function refresh(){
 const {data,error}=await sb.from("auction_state").select("*").eq("id",1).single();
 if(error)return;
 state=data;
 document.getElementById("itemLabel").textContent=`Item ${data.item_number}: ${data.item_name}`;
 document.getElementById("currentBid").textContent=money(data.current_bid);
 document.getElementById("highest").textContent=data.highest_bidder?`${data.highest_bidder} (${data.highest_bid_source})`:"No bidder";
 document.getElementById("status").textContent=data.status.toUpperCase();
 const sold = String(data.status).toLowerCase()==="sold" || String(data.status).toLowerCase()==="sold_out";
 document.getElementById("soldOverlay").classList.toggle("show",sold);
 document.getElementById("soldSub").textContent=data.highest_bidder?`Winner: ${data.highest_bidder} • ${money(data.current_bid)}`:"Item sold successfully";
}

async function bid(){
 const amount=Number(document.getElementById("amount").value),msg=document.getElementById("msg");
 msg.textContent="";
 if(!bidderName)return msg.textContent="Please enter your name first.";
 if(!amount)return msg.textContent="Enter your bid.";
 const {data,error}=await sb.rpc("place_bid",{p_item_number:state.item_number,p_bidder_name:bidderName,p_amount:amount,p_source:"online"});
 if(error)msg.textContent="❌ "+error.message;
 else{msg.textContent=data.ok?"✅ Bid accepted!":"❌ "+data.message;if(data.ok){document.getElementById("amount").value="";await refresh();}}
}

async function setupCameraViewer(){
 camChannel=sb.channel("church-auction-camera-v1",{config:{broadcast:{ack:true}}});
 camChannel.on('broadcast',{event:'offer'},async ({payload})=>{
   if(payload.id!==viewerId)return;
   if(camPeer)camPeer.close();
   camPeer=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]});
   camPeer.ontrack=e=>{document.getElementById('cameraVideo').srcObject=e.streams[0];document.getElementById('cameraStatus').textContent='🔴 LIVE PRODUCT CAMERA';};
   camPeer.onicecandidate=e=>{if(e.candidate)camChannel.send({type:'broadcast',event:'ice',payload:{id:viewerId,candidate:e.candidate}})};
   await camPeer.setRemoteDescription(payload.description);const ans=await camPeer.createAnswer();await camPeer.setLocalDescription(ans);
   await camChannel.send({type:'broadcast',event:'answer',payload:{id:viewerId,description:camPeer.localDescription}});
 }).on('broadcast',{event:'ice'},async ({payload})=>{if(payload.id!==viewerId||!camPeer||!payload.candidate)return;try{await camPeer.addIceCandidate(payload.candidate)}catch(e){}}).subscribe(async status=>{if(status==='SUBSCRIBED'){await camChannel.send({type:'broadcast',event:'join',payload:{id:viewerId}});setInterval(()=>camChannel.send({type:'broadcast',event:'join',payload:{id:viewerId}}),5000);}});
}

init();
</script>
</body></html>
